<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Sunrise over Lake Monona with the Capitol on the isthmus. Top-left stays light for text. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ee"/>
      <stop offset="0.45" stop-color="#f8e9da"/>
      <stop offset="0.62" stop-color="#f3d7c3"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="1180" cy="520" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbd2a8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f8dcc0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f8e9da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ebe8"/>
      <stop offset="0.5" stop-color="#c7dadb"/>
      <stop offset="1" stop-color="#a7c3c7"/>
    </linearGradient>
    <linearGradient id="mendota" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e4dc"/>
      <stop offset="1" stop-color="#d4e0dd"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98f86" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b98f86" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f2ea" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f6f2ea" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky and sun -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="548" r="64" fill="#f6c396" fill-opacity="0.75"/>

  <!-- Birds -->
  <g fill="none" stroke="#b98f86" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round">
    <path d="M1296 332 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M1352 300 q7 -6 14 0 q7 -6 14 0"/>
    <path d="M1248 380 q6 -5 12 0 q6 -5 12 0"/>
  </g>

  <!-- Far shore beyond Lake Mendota -->
  <path d="M0 566 C 180 548 330 556 520 548 C 720 540 860 552 1040 546 C 1240 540 1420 552 1600 544 L1600 590 L0 590 Z" fill="#e7cfc0" fill-opacity="0.8"/>
  <rect y="578" width="1600" height="30" fill="url(#mendota)"/>

  <!-- Skyline -->
  <g fill="#c9a49a" fill-opacity="0.55">
    <rect x="700" y="586" width="36" height="26"/>
    <rect x="742" y="574" width="28" height="38"/>
    <rect x="776" y="590" width="44" height="22"/>
    <rect x="826" y="580" width="30" height="32"/>
    <rect x="1136" y="582" width="34" height="30"/>
    <rect x="1176" y="570" width="26" height="42"/>
    <rect x="1208" y="588" width="48" height="24"/>
    <rect x="1262" y="578" width="30" height="34"/>
  </g>

  <!-- Capitol -->
  <g fill="#b98f86">
    <rect x="872" y="584" width="256" height="30"/>
    <rect x="900" y="570" width="200" height="16"/>
    <rect x="958" y="522" width="84" height="50"/>
    <rect x="952" y="514" width="96" height="10"/>
    <path d="M956 516 C 956 468 978 440 1000 436 C 1022 440 1044 468 1044 516 Z"/>
    <rect x="992" y="410" width="16" height="28"/>
    <path d="M988 412 C 988 400 994 394 1000 392 C 1006 394 1012 400 1012 412 Z"/>
    <rect x="998.5" y="368" width="3" height="26"/>
  </g>
  <g fill="#f3d7c3" fill-opacity="0.55">
    <rect x="968" y="530" width="5" height="38"/>
    <rect x="982" y="530" width="5" height="38"/>
    <rect x="996" y="530" width="5" height="38"/>
    <rect x="1010" y="530" width="5" height="38"/>
    <rect x="1024" y="530" width="5" height="38"/>
  </g>

  <!-- The isthmus -->
  <path d="M0 612 C 200 604 420 616 640 608 C 860 600 1100 614 1320 606 C 1440 602 1520 606 1600 604 L1600 640 C 1380 646 1180 636 960 642 C 720 648 420 636 0 644 Z" fill="#c4c3a2"/>
  <g fill="#aeb58f" fill-opacity="0.9">
    <circle cx="120" cy="608" r="14"/><circle cx="142" cy="604" r="18"/><circle cx="166" cy="610" r="12"/>
    <circle cx="430" cy="610" r="13"/><circle cx="452" cy="605" r="17"/>
    <circle cx="1380" cy="604" r="15"/><circle cx="1404" cy="600" r="19"/><circle cx="1428" cy="606" r="12"/>
  </g>

  <!-- Lake Monona -->
  <rect y="640" width="1600" height="360" fill="url(#lake)"/>
  <rect x="930" y="642" width="140" height="120" fill="url(#reflect)"/>
  <rect x="1130" y="642" width="100" height="140" fill="#f6c396" fill-opacity="0.18"/>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M1110 668 h70"/><path d="M1150 688 h50"/><path d="M1120 712 h90"/>
    <path d="M880 700 h60"/><path d="M620 736 h80"/><path d="M300 690 h54"/>
    <path d="M1340 760 h70"/><path d="M180 800 h90"/><path d="M760 830 h110"/>
    <path d="M1210 880 h120"/><path d="M420 900 h90"/><path d="M980 950 h140"/>
  </g>

  <!-- Keep the text side calm -->
  <rect width="1600" height="1000" fill="url(#wash)"/>
</svg>
