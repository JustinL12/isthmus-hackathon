<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Isthmus Care">
  <title>Isthmus Care</title>
  <!-- Badge: cream fill, red ring -->
  <circle cx="80" cy="80" r="72" fill="#FBF5EC" stroke="#B83A2E" stroke-width="7"/>
  <g fill="#B83A2E">
    <!-- Paw pad shaped like the Capitol dome -->
    <path d="M54 84 A26 26 0 0 1 106 84 L106 91 A11 11 0 0 1 95 102 L65 102 A11 11 0 0 1 54 91 Z"/>
    <!-- Toes -->
    <ellipse cx="43.6" cy="63" rx="7.5" ry="10" transform="rotate(-36 43.6 63)"/>
    <ellipse cx="65.6" cy="44.5" rx="8.5" ry="11" transform="rotate(-12 65.6 44.5)"/>
    <ellipse cx="94.4" cy="44.5" rx="8.5" ry="11" transform="rotate(12 94.4 44.5)"/>
    <ellipse cx="116.4" cy="63" rx="7.5" ry="10" transform="rotate(36 116.4 63)"/>
    <!-- Isthmus (land line) -->
    <rect x="30" y="108" width="100" height="8" rx="4"/>
  </g>
  <!-- Lake wave -->
  <path d="M50 128 q7.5 -6 15 0 t15 0 t15 0 t15 0" fill="none" stroke="#B83A2E" stroke-width="5" stroke-linecap="round"/>
</svg>
